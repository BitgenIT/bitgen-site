<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <rect width="900" height="320" fill="#f8fafc"/>
  <!-- box 1: dispositivo -->
  <rect x="40" y="110" width="200" height="100" rx="14" fill="#3b82f6"/>
  <text x="140" y="155" font-family="Arial" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">Il tuo</text>
  <text x="140" y="185" font-family="Arial" font-size="24" font-weight="bold" fill="#fff" text-anchor="middle">dispositivo</text>
  <!-- box 2: internet -->
  <rect x="350" y="110" width="200" height="100" rx="14" fill="#22c55e"/>
  <text x="450" y="170" font-family="Arial" font-size="26" font-weight="bold" fill="#fff" text-anchor="middle">Internet</text>
  <!-- box 3: data center -->
  <rect x="660" y="110" width="200" height="100" rx="14" fill="#a855f7"/>
  <text x="760" y="155" font-family="Arial" font-size="22" font-weight="bold" fill="#fff" text-anchor="middle">Data center</text>
  <text x="760" y="185" font-family="Arial" font-size="18" fill="#f3e8ff" text-anchor="middle">(il "cloud")</text>
  <!-- frecce -->
  <line x1="245" y1="160" x2="345" y2="160" stroke="#0f172a" stroke-width="5" marker-end="url(#a)"/>
  <line x1="555" y1="160" x2="655" y2="160" stroke="#0f172a" stroke-width="5" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 z" fill="#0f172a"/>
    </marker>
  </defs>
  <text x="450" y="60" font-family="Arial" font-size="22" font-weight="bold" fill="#0f172a" text-anchor="middle">Dove finiscono davvero i tuoi file</text>
</svg>
